services:
  api:
    build:
      context: ./api
      target: ${API_TARGET:-default}
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DATA_DIR: /data
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RP_ID: ${RP_ID:?}
      ORIGIN: ${ORIGIN:?}
      RP_NAME: ${RP_NAME:-openGym}
      ALLOW_GUEST: ${ALLOW_GUEST:-0}
      INVITE_ONLY: ${INVITE_ONLY:-0}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-0}
      FIRST_USER_ADMIN: ${FIRST_USER_ADMIN:-0}
      ADMIN_UIDS: ${ADMIN_UIDS:-}
      DEFAULT_LANG: ${DEFAULT_LANG:-}
      SESSION_DAYS: ${SESSION_DAYS:-90}
      COACH_DISABLED: ${COACH_DISABLED:-}
    volumes:
      - /srv/sensitive/opengym/data:/data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    expose:
      - "80"
    environment:
      NGINX_PORT: ${NGINX_PORT:-80}
      BACKEND: api
      PORT: ${PORT:-3000}
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ${CF_CONNECTING_IP:-}
      BASE_PATH: ${BASE_PATH:-}
      MEDIA_UPLOAD_MAX: ${MEDIA_UPLOAD_MAX:-48m}
